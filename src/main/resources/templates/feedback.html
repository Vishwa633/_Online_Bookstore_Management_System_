<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form id="feedbackForm">
        <input type="text" id="name" placeholder="Name" required><br>
        <input type="email" id="email" placeholder="Email" required><br>
        <textarea id="message" placeholder="Your feedback" required></textarea><br>
        <button type="submit">Submit Feedback</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const feedback = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value,
                date: new Date().toISOString().split('T')[0]
            };
            fetch('/api/feedback/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(feedback)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('result').textContent = 'Thank you for your feedback!';
                    document.getElementById('feedbackForm').reset();
                } else {
                    document.getElementById('result').textContent = 'Failed to submit feedback.';
                }
            })
            .catch(() => {
                document.getElementById('result').textContent = 'Error submitting feedback.';
            });
        });
    </script>
</body>
</html>
