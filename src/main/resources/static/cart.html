<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="image/favicon.png" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Book Store</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        .cart-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr;
            padding: 20px 0;
            border-bottom: 2px solid #e0e0e0;
            font-weight: bold;
            color: #333;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr;
            padding: 20px 0;
            border-bottom: 1px solid #e0e0e0;
            align-items: center;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-item-image {
            width: 100px;
            height: 120px;
            object-fit: contain;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 5px;
        }

        .cart-item-details h3 {
            margin: 0 0 5px 0;
            color: #333;
        }

        .cart-item-details p {
            margin: 0;
            color: #666;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-btn:hover {
            background: #e0e0e0;
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .remove-btn {
            color: #ff4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
        }

        .remove-btn:hover {
            color: #cc0000;
        }

        .cart-summary {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            float: right;
            width: 300px;
        }

        .cart-summary h2 {
            margin: 0 0 20px 0;
            color: #333;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
        }

        .summary-row.total {
            font-weight: bold;
            color: #333;
            font-size: 1.2em;
            border-top: 2px solid #e0e0e0;
            padding-top: 10px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .checkout-btn, .continue-shopping-btn {
            background: #089da1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            flex: 1;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .continue-shopping-btn {
            background: #6c757d;
        }

        .checkout-btn:hover {
            background: #067a7d;
        }

        .continue-shopping-btn:hover {
            background: #5a6268;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 0;
            color: #666;
        }

        .empty-cart i {
            font-size: 4em;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            margin: 0 0 20px 0;
            color: #333;
        }

        .continue-shopping {
            display: inline-block;
            background: #089da1;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .continue-shopping:hover {
            background: #067a7d;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h1>Shopping Cart</h1>
        <div id="cart-content">
            <!-- Cart items will be dynamically added here -->
        </div>
    </div>

    <script>
        let currentUserId = localStorage.getItem('userId') || localStorage.getItem('cartGuestId');
        if (!currentUserId) {
            currentUserId = 'guest_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('cartGuestId', currentUserId);
        }

        // Check if user is logged in
        const loggedInUserId = localStorage.getItem('userId');
        if (loggedInUserId) {
            // If user is logged in, use their user ID instead of guest ID
            currentUserId = loggedInUserId;
            // Clear the guest cart ID since we're now using the user's ID
            localStorage.removeItem('cartGuestId');
        }

        window.onload = function() {
            getCart(currentUserId);
        }

        function getCart(userId) {
            fetch(`/api/cart/${userId}`)
                .then(res => res.json())
                .then(items => {
                    renderCart(items);
                });
        }

        function renderCart(items) {
            const cartContent = document.getElementById('cart-content');
            if (!items || items.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <h2>Your cart is empty</h2>
                        <p>Looks like you haven't added any books to your cart yet.</p>
                        <a href="books.html" class="continue-shopping">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            let total = 0;
            let cartHTML = `
                <div class="cart-header">
                    <div>Product</div>
                    <div>Price</div>
                    <div>Quantity</div>
                    <div>Subtotal</div>
                    <div></div>
                </div>
            `;

            items.forEach(item => {
                const subtotal = item.subtotal || (item.price * item.quantity);
                total += subtotal;
                cartHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.imageUrl}" alt="${item.title}" class="cart-item-image">
                            <div class="cart-item-details">
                                <h3>${item.title}</h3>
                                <p>${item.author}</p>
                            </div>
                        </div>
                        <div>$${item.price.toFixed(2)}</div>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                        <div>$${subtotal.toFixed(2)}</div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            cartHTML += `
                <div class="cart-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <div class="button-group">
                        <a href="books.html" class="continue-shopping-btn">Continue Shopping</a>
                        <a href="order.html" class="checkout-btn">Checkout</a>
                    </div>
                </div>
            `;

            cartContent.innerHTML = cartHTML;
        }

        function updateQuantity(itemId, quantity) {
            if (quantity < 1) return;
            fetch(`/api/cart/${currentUserId}/update?itemId=${itemId}&quantity=${quantity}`, { method: 'PUT' })
                .then(() => getCart(currentUserId));
        }

        function removeItem(itemId) {
            fetch(`/api/cart/${currentUserId}/remove?itemId=${itemId}`, { method: 'DELETE' })
                .then(() => getCart(currentUserId));
        }

        function checkout() {
            fetch(`/api/cart/${currentUserId}/clear`, { method: 'DELETE' })
                .then(() => {
                    alert('Thank you for your purchase! This is a demo, so no actual payment will be processed.');
                    getCart(currentUserId);
                });
        }

        function addToCart(bookId) {
            let currentUserId = localStorage.getItem('cartGuestId');
            if (!currentUserId) {
                currentUserId = 'guest_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('cartGuestId', currentUserId);
            }
            fetch(`/api/cart/${currentUserId}/add?itemId=${bookId}`, { method: 'POST' })
                .then(res => {
                    if (!res.ok) {
                        alert('Failed to add to cart!');
                        return;
                    }
                    // After adding, update the cart count
                    return fetch(`/api/cart/${currentUserId}`);
                })
                .then(res => res ? res.json() : null)
                .then(items => {
                    if (items) {
                        document.getElementById('cart-count').textContent = items.length;
                    }
                    // No redirect!
                })
                .catch(() => alert('Failed to add to cart!'));
        }
    </script>
</body>
</html>
