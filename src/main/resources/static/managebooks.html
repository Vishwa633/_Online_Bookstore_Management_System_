<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="image/favicon.png" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books - Admin</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            max-width: 900px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(8,157,161,0.10);
            padding: 2rem 2.5rem 2.5rem 2.5rem;
        }
        h2 {
            color: #089da1;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: flex-end;
        }
        form input {
            padding: 0.7rem 1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1 1 180px;
        }
        form button {
            background: #089da1;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        form button:hover {
            background: #067a7d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th, td {
            padding: 0.8rem 0.5rem;
            text-align: left;
        }
        th {
            background: #089da1;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f4f8fa;
        }
        tr:nth-child(odd) {
            background: #fff;
        }
        .action-btn {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 1rem;
            margin-right: 0.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .action-btn.edit {
            background: #089da1;
        }
        .action-btn:hover {
            opacity: 0.85;
        }
        .logout-link {
            float: right;
            margin-top: 1rem;
            color: #089da1;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }
        .logout-link:hover {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="logout-link" onclick="logout()">Logout</span>
        <h2>Manage Books</h2>
    
        <form id="bookForm">
            <input type="hidden" id="bookId">
            <input type="text" id="title" placeholder="Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="number" id="price" placeholder="Price" step="0.01" required>
            <input type="text" id="image" placeholder="Image Path (e.g. image/book1.jpg)" required>
            <button type="submit" id="addBtn">Add Book</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price ($)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="booksTable">
                <!-- Books will be listed here -->
            </tbody>
        </table>
    </div>
    <script>
        // Only allow admin
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!user || user.role !== 'ADMIN') {
            alert('Access denied! Only admin can manage books.');
            window.location.href = 'index.html';
        }

        function renderBooks() {
            const books = JSON.parse(localStorage.getItem('books') || '[]');
            const tbody = document.getElementById('booksTable');
            tbody.innerHTML = '';
            books.forEach(book => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${book.image}" alt="${book.title}" style="width:50px;height:70px;object-fit:contain;border-radius:4px;"></td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>$${book.price.toFixed(2)}</td>
                        <td>
                            <button class="action-btn edit" onclick="editBook(${book.id})">Edit</button>
                            <button class="action-btn" onclick="deleteBook(${book.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Add or update book
        document.getElementById('bookForm').onsubmit = function(e) {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const price = parseFloat(document.getElementById('price').value);
            const image = document.getElementById('image').value;

            const bookData = { title, author, price, image };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/books/${id}` : '/api/books';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                return res.json();
            })
            .then(newBook => {
                // Get current books from localStorage
                let books = JSON.parse(localStorage.getItem('books') || '[]');
                
                if (id) {
                    // Update existing book
                    books = books.map(book => book.id === parseInt(id) ? newBook : book);
                } else {
                    // Add new book
                    books.push(newBook);
                }
                
                // Update localStorage
                localStorage.setItem('books', JSON.stringify(books));
                
                // Update UI
                renderBooks();
                document.getElementById('bookForm').reset();
                document.getElementById('addBtn').textContent = 'Add Book';
                document.getElementById('bookId').value = '';
                
                // Show success message
                alert(id ? 'Book updated successfully!' : 'Book added successfully!');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error: ' + (error.message || 'Failed to add/update book. Please try again.'));
            });
        };

        // Edit book (fetch book details and fill form)
        window.editBook = function(id) {
            const books = JSON.parse(localStorage.getItem('books') || '[]');
            const book = books.find(b => b.id === id);
            if (book) {
                document.getElementById('bookId').value = book.id;
                document.getElementById('title').value = book.title;
                document.getElementById('author').value = book.author;
                document.getElementById('price').value = book.price;
                document.getElementById('image').value = book.image;
                document.getElementById('addBtn').textContent = 'Update Book';
            }
        };

        // Delete book
        window.deleteBook = function(id) {
            if (confirm('Are you sure you want to delete this book?')) {
                fetch(`/api/books/${id}`, { method: 'DELETE' })
                    .then(() => {
                        // Get current books from localStorage
                        let books = JSON.parse(localStorage.getItem('books') || '[]');
                        // Remove the deleted book
                        books = books.filter(book => book.id !== id);
                        // Update localStorage
                        localStorage.setItem('books', JSON.stringify(books));
                        // Update UI
                        renderBooks();
                    });
            }
        };

        // Logout
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Initial load of books from API
        function loadInitialBooks() {
            fetch('/api/books')
                .then(res => res.json())
                .then(books => {
                    localStorage.setItem('books', JSON.stringify(books));
                    renderBooks();
                })
                .catch(error => {
                    console.error('Error loading books:', error);
                    alert('Error loading books. Please refresh the page.');
                });
        }

        // Call loadInitialBooks when page loads
        loadInitialBooks();
    </script>
</body>
</html>
