<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png" />
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f8f8ff;
            color: #222831;
        }
        .section-title {
            background: linear-gradient(90deg, #089da1 70%, #b5eaeb 100%);
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 2px 8px rgba(8, 157, 161, 0.08);
            font-weight: 600;
            letter-spacing: 1px;
        }
        .card {
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 24px rgba(8, 157, 161, 0.08);
            border: none;
        }
        .btn-success, .btn-success:focus, .btn-success:active {
            background: #089da1 !important;
            border-color: #089da1 !important;
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(8, 157, 161, 0.10);
            transition: background 0.2s;
        }
        .btn-success:hover {
            background: #0bbfc3 !important;
            border-color: #0bbfc3 !important;
            color: #fff;
        }
        .orders-table th {
            background: #b5eaeb !important;
            color: #089da1;
            font-weight: 600;
            font-size: 1.05rem;
            border-bottom: 2px solid #089da1;
        }
        .orders-table td {
            background: #fff;
            color: #222831;
        }
        h2 {
            color: #089da1;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Orders</h2>
        <a href="books.html" class="btn btn-success">Continue Shopping</a>
    </div>
    <div class="card shadow">
        <div class="section-title">
            <h4 class="mb-0">Order History</h4>
        </div>
        <div class="card-body">
            <div id="orders-content">
                <div class="text-center text-muted">Loading your orders...</div>
            </div>
        </div>
    </div>
</div>
<script>
    let currentUserId = localStorage.getItem('cartGuestId');
    if (!currentUserId) {
        currentUserId = 'guest_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('cartGuestId', currentUserId);
    }

    window.onload = function() {
        fetch(`/api/orders?userId=${currentUserId}`)
            .then(res => res.json())
            .then(orders => {
                // Sample delivered orders
                const sampleOrders = [
                    {
                        deliveryDate: "2024-06-01",
                        fullName: "Jane Smith",
                        email: "jane@example.com",
                        address: "123 Main St, Colombo",
                        delivered: true,
                        items: [
                            { title: "The Great Gatsby", quantity: 1, price: 19.99 },
                            { title: "1984", quantity: 2, price: 14.99 }
                        ]
                    },
                    {
                        deliveryDate: "2024-05-15",
                        fullName: "Jane Smith",
                        email: "jane@example.com",
                        address: "123 Main St, Colombo",
                        delivered: true,
                        items: [
                            { title: "Pride and Prejudice", quantity: 1, price: 12.99 }
                        ]
                    },
                    {
                        deliveryDate: "2024-04-20",
                        fullName: "Jane Smith",
                        email: "jane@example.com",
                        address: "123 Main St, Colombo",
                        delivered: true,
                        items: [
                            { title: "Harry Potter and the Sorcerer's Stone", quantity: 1, price: 17.99 },
                            { title: "The Hobbit", quantity: 1, price: 16.99 }
                        ]
                    }
                ];
                // Combine new (pending) orders at the top, old (delivered) at the bottom
                if (!orders || orders.length === 0) {
                    orders = sampleOrders;
                } else {
                    orders = orders.map(o => ({...o, delivered: false})).concat(sampleOrders);
                }
                renderOrders(orders);
            });
    };

    function renderOrders(orders) {
        const container = document.getElementById('orders-content');
        if (!orders || orders.length === 0) {
            container.innerHTML = `<div class="text-center text-muted">You have no orders yet.</div>`;
            return;
        }
        // Filter out orders with 0 products
        orders = orders.filter(order => order.items && order.items.length > 0);
        let html = '';
        const totalOrders = orders.length;
        orders.forEach((order, idx) => {
            const orderNum = totalOrders - idx;
            const orderDate = order.deliveryDate || '-';
            const customerName = order.fullName || "Jane Smith";
            const email = order.email || "jane@example.com";
            const address = order.address || "123 Main St, Colombo";
            const itemsCount = order.items ? order.items.length : 0;
            const itemsList = order.items
                ? order.items.map(item => `<span class="badge rounded-pill bg-light text-dark border border-success me-2 mb-1"><span style="color:#22bb33;font-size:1.2em;">●</span> ${item.title || item.productName}</span>`).join(' ')
                : '';
            // Status: delivered flag for old, pending for new
            const statusBadge = order.delivered
                ? '<span class="badge bg-success text-light ms-2"><i class="bi bi-check-circle"></i> Delivered</span>'
                : '<span class="badge bg-warning text-dark ms-2"><i class="bi bi-clock"></i> Pending</span>';
            html += `
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <span class="text-muted">Order #${orderNum}</span>
                            ${statusBadge}
                        </div>
                        <div class="text-end text-muted" style="font-size:0.95em;">
                            Items<br><span class="fw-bold" style="color:#089da1;">${itemsCount} product${itemsCount !== 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <div class="mb-2">
                        <span class="fw-bold" style="font-size:1.1em;">${customerName}</span>
                    </div>
                    <div class="mb-2 text-muted" style="font-size:0.97em;">
                        <span class="me-3"><i class="bi bi-envelope"></i> ${email}</span>
                        <span><i class="bi bi-geo-alt"></i> ${address}</span>
                    </div>
                    <div class="mt-2">
                        ${itemsList}
                    </div>
                </div>
            </div>
            `;
        });
        container.innerHTML = html;
    }
</script>
</body>
</html>
